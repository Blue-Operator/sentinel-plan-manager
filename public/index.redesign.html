document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

enter; justify-content:center;\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" style=\"color:var(--accent);\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 7v10M9 9.5h4a1.5 1.5 0 0 1 0 3h-2a1.5 1.5 0 0 0 0 3h4\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--accent); font-weight:700; margin-bottom:8px;\">IBC-Compatible Tokens<\u002Fdiv>\n              <div style=\"font-family:'Europa','Funnel Display'; font-size:21px; font-weight:600; margin-bottom:12px;\">On-Chain Payments<\u002Fdiv>\n              <p style=\"font-size:14px; color:var(--dim); line-height:1.6; margin-bottom:20px;\">Native settlement on Sentinel. Subscribers pay directly in IBC tokens — ATOM, P2P/DVPN, OSMO and any other denom the chain accepts. No middleman, no chargebacks, instant on-chain finality.<\u002Fp>\n              <div style=\"display:flex; flex-direction:column; gap:11px; margin-bottom:22px;\">\n                <div style=\"display:flex; align-items:center; gap:10px; font-size:13px; color:var(--dim);\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--green)\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6L9 17l-5-5\"><\u002Fpath><\u002Fsvg>Multi-currency: P2P, ATOM, OSMO, JUNO, AKT, NTRN<\u002Fdiv>\n                <div style=\"display:flex; align-items:center; gap:10px; font-size:13px; color:var(--dim);\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--green)\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6L9 17l-5-5\"><\u002Fpath><\u002Fsvg>Subscribers pick which denom to pay with at checkout<\u002Fdiv>\n                <div style=\"display:flex; align-items:center; gap:10px; font-size:13px; color:var(--dim);\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--green)\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6L9 17l-5-5\"><\u002Fpath><\u002Fsvg>No backend required — payment is fully on-chain<\u002Fdiv>\n              <\u002Fdiv>\n              <span style=\"font-size:13px; color:var(--accent); font-weight:700; cursor:pointer;\">View plan pricing &amp; accepted currencies →<\u002Fspan>\n            <\u002Fdiv>\n\n            <div class=\"lift\" style=\"background:var(--panel); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow-sm); padding:28px; transition:transform 0.25s,border-color 0.25s;\">\n              <div style=\"display:flex; gap:10px; margin-bottom:22px;\">\n                <span style=\"width:42px; height:42px; border-radius:11px; background:var(--panel-2); display:flex; align-items:center; justify-content:center;\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" style=\"color:var(--text);\"><rect x=\"2\" y=\"5\" width=\"20\" height=\"14\" rx=\"2.5\"><\u002Frect><path d=\"M2 10h20\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--dim); font-weight:700; margin-bottom:8px;\">Stripe · PayPal · BTC<\u002Fdiv>\n              <div style=\"font-family:'Europa','Funnel Display'; font-size:21px; font-weight:600; margin-bottom:12px;\">Fiat Payment Rails &amp; Non-IBC Token Payments<\u002Fdiv>\n              <p style=\"font-size:14px; color:var(--dim); line-height:1.6; margin-bottom:20px;\">Take payment off-chain through any processor — Stripe, PayPal, BTCPay, or even ad-supported free access — then trigger the subscription on-chain with one API call. You cover network fees so subscribers never need to hold a token.<\u002Fp>\n              <div style=\"display:flex; flex-direction:column; gap:11px; margin-bottom:22px;\">\n                <div style=\"display:flex; align-items:center; gap:10px; font-size:13px; color:var(--dim);\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--green)\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6L9 17l-5-5\"><\u002Fpath><\u002Fsvg>Deterrent on-chain price blocks accidental direct buys<\u002Fdiv>\n                <div style=\"display:flex; align-items:center; gap:10px; font-size:13px; color:var(--dim);\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--green)\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6L9 17l-5-5\"><\u002Fpath><\u002Fsvg>Your backend gates checkout via fee-grant or relayed signing<\u002Fdiv>\n                <div style=\"display:flex; align-items:center; gap:10px; font-size:13px; color:var(--dim);\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--green)\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6L9 17l-5-5\"><\u002Fpath><\u002Fsvg>Just pick a data cap — no chain pricing decisions to make<\u002Fdiv>\n              <\u002Fdiv>\n              <span style=\"font-size:13px; color:var(--accent); font-weight:700; cursor:pointer;\">View rails &amp; authorization triggers →<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- ═══════════ FEE GRANTS ═══════════ -->\n        <sc-if value=\"{{ showFees }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"animation:fadeUp 0.4s ease both;\">\n          <div style=\"display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:24px;\">\n            <div>\n              <h1 style=\"font-family:'Europa','Funnel Display'; font-size:27px; font-weight:600; letter-spacing:-0.02em;\">Cover network fees for your subscribers<\u002Fh1>\n              <p style=\"color:var(--dim); font-size:14px; margin-top:7px;\">Your subscribers shouldn't need to think about network fees — you pick up the tab so they can connect instantly. Grant fee coverage in bulk or turn on auto-grant to handle new subscribers for you.<\u002Fp>\n            <\u002Fdiv>\n            <button style-hover=\"filter:brightness(1.08)\" style=\"display:inline-flex; align-items:center; gap:7px; background:var(--accent); color:#fff; border:none; font-family:'Lato'; font-size:13px; font-weight:700; padding:10px 17px; border-radius:9px; cursor:pointer; box-shadow:0 8px 20px -10px var(--accent-glow); transition:0.16s; flex:none;\">Grant all ungranted<\u002Fbutton>\n          <\u002Fdiv>\n\n          <div style=\"display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:18px;\">\n            <div style=\"background:var(--panel); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow-sm); padding:20px;\">\n              <div style=\"font-size:11px; letter-spacing:0.07em; text-transform:uppercase; color:var(--muted); font-weight:700;\">Total Subscribers<\u002Fdiv>\n              <div style=\"font-family:'Europa','Funnel Display'; font-size:28px; font-weight:600; margin-top:11px;\">342<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:var(--panel); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow-sm); padding:20px;\">\n              <div style=\"font-size:11px; letter-spacing:0.07em; text-transform:uppercase; color:var(--muted); font-weight:700;\">Have Fee Grant<\u002Fdiv>\n              <div style=\"font-family:'Europa','Funnel Display'; font-size:28px; font-weight:600; margin-top:11px; color:var(--green);\">328<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:var(--panel); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow-sm); padding:20px;\">\n              <div style=\"font-size:11px; letter-spacing:0.07em; text-transform:uppercase; color:var(--muted); font-weight:700;\">Without Grant<\u002Fdiv>\n              <div style=\"font-family:'Europa','Funnel Display'; font-size:28px; font-weight:600; margin-top:11px; color:var(--yellow);\">14<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:var(--panel); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow-sm); padding:20px;\">\n              <div style=\"font-size:11px; letter-spacing:0.07em; text-transform:uppercase; color:var(--muted); font-weight:700;\">Coverage<\u002Fdiv>\n              <div style=\"font-family:'Europa','Funnel Display'; font-size:28px; font-weight:600; margin-top:11px; color:var(--accent);\">96%<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background:var(--panel); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow-sm); padding:22px; margin-bottom:16px;\">\n            <div style=\"display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;\">\n              <span style=\"font-size:13px; color:var(--dim); font-weight:700;\">Coverage across all subscribers<\u002Fspan>\n              <span style=\"font-size:13px; font-weight:700; color:var(--accent);\">328 / 342<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"height:9px; border-radius:6px; background:var(--panel-3); overflow:hidden;\">\n              <div style=\"height:100%; width:96%; background:linear-gradient(90deg, var(--accent), var(--accent-bright)); border-radius:6px;\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex; align-items:center; gap:28px; margin-top:20px; flex-wrap:wrap;\">\n              <div>\n                <div style=\"font-size:11px; letter-spacing:0.07em; text-transform:uppercase; color:var(--muted); font-weight:700; margin-bottom:6px;\">Spend limit<\u002Fdiv>\n                <div style=\"display:flex; align-items:baseline; gap:5px;\"><span style=\"font-family:'Europa','Funnel Display'; font-size:18px; font-weight:600;\">10<\u002Fspan><span style=\"font-size:12px; color:var(--dim);\">P2P<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n              <div>\n                <div style=\"font-size:11px; letter-spacing:0.07em; text-transform:uppercase; color:var(--muted); font-weight:700; margin-bottom:6px;\">Expiration<\u002Fdiv>\n                <div style=\"display:flex; align-items:baseline; gap:5px;\"><span style=\"font-family:'Europa','Funnel Display'; font-size:18px; font-weight:600;\">30<\u002Fspan><span style=\"font-size:12px; color:var(--dim);\">days<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"margin-left:auto; display:flex; align-items:center; gap:11px;\">\n                <div style=\"width:42px; height:24px; border-radius:13px; background:var(--accent); position:relative; cursor:pointer;\"><span style=\"position:absolute; top:3px; right:3px; width:18px; height:18px; border-radius:50%; background:#fff;\"><\u002Fspan><\u002Fdiv>\n                <div>\n                  <div style=\"font-size:13px; font-weight:700;\">Auto-grant new subscribers<\u002Fdiv>\n                  <div style=\"font-size:12px; color:var(--muted);\">Runs on every page load<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background:var(--panel); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow-sm); overflow:hidden;\">\n            <div style=\"padding:18px 20px; border-bottom:1px solid var(--border); font-family:'Europa','Funnel Display'; font-size:16px; font-weight:600;\">Active fee grants<\u002Fdiv>\n            <div style=\"display:grid; grid-template-columns:minmax(160px,1.7fr) 1.4fr 1fr 1fr 1fr 1fr; gap:12px; padding:13px 20px; background:var(--panel-2); border-bottom:1px solid var(--border); font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:var(--muted); font-weight:700;\">\n              <span>Grantee<\u002Fspan><span>Plan<\u002Fspan><span>Spend limit<\u002Fspan><span>Used<\u002Fspan><span>Expires<\u002Fspan><span>Status<\u002Fspan>\n            <\u002Fdiv>\n            <sc-for list=\"{{ grants }}\" as=\"g\" hint-placeholder-count=\"4\">\n              <div class=\"tbl-row\" style-hover=\"background:var(--panel-2)\" style=\"display:grid; grid-template-columns:minmax(160px,1.7fr) 1.4fr 1fr 1fr 1fr 1fr; gap:12px; padding:15px 20px; align-items:center; border-bottom:1px solid var(--border); transition:background 0.14s;\">\n                <span style=\"font-family:'Noto Sans Mono',monospace; font-size:13px; font-weight:500;\">{{ g.grantee }}<\u002Fspan>\n                <span style=\"font-size:14px; color:var(--dim);\">{{ g.plan }}<\u002Fspan>\n                <span style=\"font-size:14px; font-weight:700;\">{{ g.limit }}<\u002Fspan>\n                <span style=\"font-size:14px; color:var(--dim);\">{{ g.used }}<\u002Fspan>\n                <span style=\"font-size:13px; color:var(--dim);\">{{ g.expires }}<\u002Fspan>\n                <span style=\"justify-self:start; display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:700; padding:3px 10px; border-radius:7px; color:{{ g.sc }}; background:{{ g.sb }};\">{{ g.status }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- ═══════════ INSTALL CLI ═══════════ -->\n        <sc-if value=\"{{ showInstallCli }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"animation:fadeUp 0.4s ease both; max-width:900px; margin:0 auto;\">\n          <div style=\"margin-bottom:24px;\">\n            <h1 style=\"font-family:'Europa','Funnel Display'; font-size:27px; font-weight:600; letter-spacing:-0.02em;\">Install the plans CLI<\u002Fh1>\n            <p style=\"color:var(--dim); font-size:14px; margin-top:7px;\">Same controls as this console, scriptable. Needs Node.js 20+ and the server running on <span style=\"font-family:'Noto Sans Mono',monospace; font-size:13px; color:var(--text);\">http://localhost:3003<\u002Fspan>.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background:var(--panel); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow-sm); padding:22px; margin-bottom:16px;\">\n            <div style=\"font-family:'Europa','Funnel Display'; font-size:16px; font-weight:600; margin-bottom:16px;\">Install &amp; verify<\u002Fdiv>\n            <div style=\"font-family:'Noto Sans Mono',monospace; font-size:13px; background:var(--panel-2); border:1px solid var(--border); border-radius:10px; padding:16px 18px; line-height:1.95; color:var(--text); overflow-x:auto;\">\n              <div>git clone https://github.com/Sentinel-Bluebuilder/sentinel-plan-manager<\u002Fdiv>\n              <div>cd sentinel-plan-manager &amp;&amp; npm install &amp;&amp; npm link<\u002Fdiv>\n              <div>plans health&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span style=\"color:var(--muted);\"># → OK  uptime: 12.4s<\u002Fspan><\u002Fdiv>\n              <div>plans wallet info&nbsp;&nbsp;<span style=\"color:var(--muted);\"># address, balance, provider<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <p style=\"font-size:13px; color:var(--dim); margin-top:14px; line-height:1.6;\">npm link puts <span style=\"font-family:'Noto Sans Mono',monospace; font-size:12px; color:var(--text);\">plans<\u002Fspan> on your PATH (plans.cmd on Windows). The CLI shares the wallet you imported in the server.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background:var(--panel); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow-sm); padding:22px; margin-bottom:18px;\">\n            <div style=\"font-family:'Europa','Funnel Display'; font-size:16px; font-weight:600; margin-bottom:14px;\">Tips<\u002Fdiv>\n            <div style=\"display:flex; flex-direction:column; gap:11px;\">\n              <div style=\"font-size:13px; color:var(--dim); line-height:1.5;\">• Skip npm link: run <span style=\"font-family:'Noto Sans Mono',monospace; font-size:12px; color:var(--text);\">node cli.js &lt;args&gt;<\u002Fspan> from the repo folder.<\u002Fdiv>\n              <div style=\"font-size:13px; color:var(--dim); line-height:1.5;\">• Remote server: <span style=\"font-family:'Noto Sans Mono',monospace; font-size:12px; color:var(--text);\">plans --base-url http://10.0.0.5:3003 plan list<\u002Fspan>.<\u002Fdiv>\n              <div style=\"font-size:13px; color:var(--dim); line-height:1.5;\">• Machine-readable output for scripts/AI agents: append <span style=\"font-family:'Noto Sans Mono',monospace; font-size:12px; color:var(--text);\">--json<\u002Fspan>.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; gap:10px;\">\n            <button style-hover=\"filter:brightness(1.08)\" style=\"display:inline-flex; align-items:center; gap:7px; background:var(--accent); color:#fff; border:none; font-family:'Lato'; font-size:13px; font-weight:700; padding:11px 16px; border-radius:9px; cursor:pointer; box-shadow:0 8px 20px -10px var(--accent-glow); transition:0.16s;\">cli.js source on GitHub →<\u002Fbutton>\n            <button style-hover=\"border-color:var(--border-hover);color:var(--text)\" style=\"display:inline-flex; align-items:center; gap:7px; background:transparent; color:var(--dim); border:1px solid var(--border); font-family:'Lato'; font-size:13px; font-weight:700; padding:11px 16px; border-radius:9px; cursor:pointer; transition:0.16s;\">README CLI section →<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- ═══════════ CLI COMMANDS ═══════════ -->\n        <sc-if value=\"{{ showCliCommands }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"animation:fadeUp 0.4s ease both; max-width:980px; margin:0 auto;\">\n          <div style=\"margin-bottom:24px;\">\n            <h1 style=\"font-family:'Europa','Funnel Display'; font-size:27px; font-weight:600; letter-spacing:-0.02em;\">CLI reference<\u002Fh1>\n            <p style=\"color:var(--dim); font-size:14px; margin-top:7px; max-width:680px;\">The full command set, grouped by area. Run <span style=\"font-family:'Noto Sans Mono',monospace; font-size:13px; color:var(--accent);\">plans &lt;group&gt; --help<\u002Fspan> for per-group detail, or add <span style=\"font-family:'Noto Sans Mono',monospace; font-size:13px; color:var(--accent);\">--json<\u002Fspan> for machine-readable output.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:16px;\">\n            <div style=\"background:var(--panel); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow-sm); padding:22px;\">\n              <div style=\"font-family:'Europa','Funnel Display'; font-size:15px; font-weight:600; margin-bottom:16px;\">Server &amp; wallet<\u002Fdiv>\n              <div style=\"display:flex; flex-direction:column; gap:13px;\">\n                <div style=\"display:grid; grid-template-columns:1fr 1.1fr; gap:16px; align-items:baseline;\"><span style=\"font-family:'Noto Sans Mono',monospace; font-size:13px; color:var(--accent);\">plans health<\u002Fspan><span style=\"font-size:13px; color:var(--dim);\">Server health + uptime<\u002Fspan><\u002Fdiv>\n                <div style=\"display:grid; grid-template-columns:1fr 1.1fr; gap:16px; align-items:baseline;\"><span style=\"font-family:'Noto Sans Mono',monospace; font-size:13px; color:var(--accent);\">plans wallet info<\u002Fspan><span style=\"font-size:13px; color:var(--dim);\">Address, P2P balance, USD value, provider registration<\u002Fspan><\u002Fdiv>\n                <div style=\"display:grid; grid-template-columns:1fr 1.1fr; gap:16px; align-items:baseline;\"><span style=\"font-family:'Noto Sans Mono',monospace; font-size:13px; color:var(--accent);\">plans wallet import \"&lt;12/24 words&gt;\"<\u002Fspan><span style=\"font-size:13px; color:var(--dim);\">Load a wallet from a mnemonic<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:var(--panel); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow-sm); padding:22px;\">\n              <div style=\"font-family:'Europa','Funnel Display'; font-size:15px; font-weight:600; margin-bottom:16px;\">Plans<\u002Fdiv>\n              <div style=\"display:flex; flex-direction:column; gap:13px;\">\n                <div style=\"display:grid; grid-template-columns:1fr 1.1fr; gap:16px; align-items:baseline;\"><span style=\"font-family:'Noto Sans Mono',monospace; font-size:13px; color:var(--accent);\">plans plan list<\u002Fspan><span style=\"font-size:13px; color:var(--dim);\">All plans on the network<\u002Fspan><\u002Fdiv>\n                <div style=\"display:grid; grid-template-columns:1fr 1.1fr; gap:16px; align-items:baseline;\"><span style=\"font-family:'Noto Sans Mono',monospace; font-size:13px; color:var(--accent);\">plans plan create --gb N --days N --price-udvpn N<\u002Fspan><span style=\"font-size:13px; color:var(--dim);\">Create a plan. Pricing is immutable once created.<\u002Fspan><\u002Fdiv>\n                <div style=\"display:grid; grid-template-columns:1fr 1.1fr; gap:16px; align-items:baseline;\"><span style=\"font-family:'Noto Sans Mono',monospace; font-size:13px; color:var(--accent);\">plans plan subscribers &lt;planId&gt;<\u002Fspan><span style=\"font-size:13px; color:var(--dim);\">Active subscriptions for the plan<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:var(--panel); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow-sm); padding:22px;\">\n              <div style=\"font-family:'Europa','Funnel Display'; font-size:15px; font-weight:600; margin-bottom:16px;\">Nodes &amp; linking<\u002Fdiv>\n              <div style=\"display:flex; flex-direction:column; gap:13px;\">\n                <div style=\"display:grid; grid-template-columns:1fr 1.1fr; gap:16px; align-items:baseline;\"><span style=\"font-family:'Noto Sans Mono',monospace; font-size:13px; color:var(--accent);\">plans node list --country XX --protocol wireguard<\u002Fspan><span style=\"font-size:13px; color:var(--dim);\">Filter the cached node list<\u002Fspan><\u002Fdiv>\n                <div style=\"display:grid; grid-template-columns:1fr 1.1fr; gap:16px; align-items:baseline;\"><span style=\"font-family:'Noto Sans Mono',monospace; font-size:13px; color:var(--accent);\">plans link &lt;planId&gt; &lt;nodeAddr&gt;<\u002Fspan><span style=\"font-size:13px; color:var(--dim);\">Link one node. Auto-leases first if needed.<\u002Fspan><\u002Fdiv>\n                <div style=\"display:grid; grid-template-columns:1fr 1.1fr; gap:16px; align-items:baseline;\"><span style=\"font-family:'Noto Sans Mono',monospace; font-size:13px; color:var(--accent);\">plans batch-link &lt;planId&gt; &lt;n1,n2,...&gt;<\u002Fspan><span style=\"font-size:13px; color:var(--dim);\">Link many nodes in one TX<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:var(--panel); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow-sm); padding:22px;\">\n              <div style=\"font-family:'Europa','Funnel Display'; font-size:15px; font-weight:600; margin-bottom:16px;\">Fee grants<\u002Fdiv>\n              <div style=\"display:flex; flex-direction:column; gap:13px;\">\n                <div style=\"display:grid; grid-template-columns:1fr 1.1fr; gap:16px; align-items:baseline;\"><span style=\"font-family:'Noto Sans Mono',monospace; font-size:13px; color:var(--accent);\">plans feegrant grant-subscribers &lt;planId&gt;<\u002Fspan><span style=\"font-size:13px; color:var(--dim);\">Batch-grant every subscriber of a plan<\u002Fspan><\u002Fdiv>\n                <div style=\"display:grid; grid-template-columns:1fr 1.1fr; gap:16px; align-items:baseline;\"><span style=\"font-family:'Noto Sans Mono',monospace; font-size:13px; color:var(--accent);\">plans feegrant auto-grant set &lt;true|false&gt;<\u002Fspan><span style=\"font-size:13px; color:var(--dim);\">Auto-grant new subscribers<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n      <\u002Fdiv>\n    <\u002Fmain>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:960},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;'dark' | 'light'&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#1E88E5&quot;,&quot;tsType&quot;:&quot;string&quot;}}\">\nclass Component extends DCLogic {\n  state = { page: 'dashboard', theme: (this.props.theme || 'dark'), planFilter: 'all', authed: true };\n\n  setPage(p) { this.setState({ page: p }); }\n  setFilter(f) { this.setState({ planFilter: f }); }\n  toggleTheme() { this.setState(s => ({ theme: s.theme === 'dark' ? 'light' : 'dark' })); }\n  login() { this.setState({ authed: true, page: 'dashboard' }); }\n  logout() { this.setState({ authed: false }); }\n\n  nav(id) {\n    const a = this.state.page === id;\n    return {\n      bg: a ? 'var(--accent-dim)' : 'transparent',\n      bar: a ? '1' : '0',\n      txt: a ? 'var(--text)' : 'var(--dim)',\n      icon: a ? 'var(--accent)' : 'var(--muted)',\n      weight: a ? '700' : '500',\n      go: () => this.setPage(id),\n    };\n  }\n\n  pill(s) {\n    const m = {\n      Active:   ['var(--green)', 'var(--green-dim)'],\n      Draft:    ['var(--muted)', 'var(--panel-2)'],\n      Expiring: ['var(--yellow)', 'var(--yellow-dim)'],\n      Expired:  ['var(--red)', 'var(--red-dim)'],\n      Online:   ['var(--green)', 'var(--green-dim)'],\n      Offline:  ['var(--muted)', 'var(--panel-2)'],\n    };\n    const v = m[s] || m.Draft;\n    return { color: v[0], bg: v[1] };\n  }\n\n  renderVals() {\n    const page = this.state.page;\n    const accent = this.props.accent || '#1E88E5';\n    const isLight = this.state.theme === 'light';\n    const titles = { dashboard:'Dashboard', provider:'Provider Identity', create:'Create Plan', plans:'Your Plans', subscribers:'Subscribers', nodes:'Add Nodes', yournodes:'Your Nodes', payment:'Payment', fees:'Fee Grants', installcli:'Install CLI', clicommands:'CLI Commands' };\n\n    const plansRaw = [\n      { name:'Global Unlimited', planId:'1042', data:'500 GB', duration:'30 days', price:'12 P2P', subs:'218', subsRaw:218, mrr:'2,616 P2P', status:'Active' },\n      { name:'Streamer',         planId:'1043', data:'250 GB', duration:'30 days', price:'8 P2P',  subs:'86',  subsRaw:86,  mrr:'688 P2P',   status:'Active' },\n      { name:'Lite',             planId:'1044', data:'100 GB', duration:'30 days', price:'4 P2P',  subs:'38',  subsRaw:38,  mrr:'152 P2P',   status:'Active' },\n      { name:'Annual Pro',       planId:'1051', data:'1 TB',   duration:'365 days',price:'120 P2P',subs:'0',   subsRaw:0,   mrr:'—',         status:'Draft'  },\n    ];\n    const maxSubs = Math.max(...plansRaw.map(p => p.subsRaw)) || 1;\n    let plans = plansRaw.map(p => {\n      const pl = this.pill(p.status);\n      return { ...p, sc: pl.color, sb: pl.bg, barW: Math.round(p.subsRaw / maxSubs * 100) + '%' };\n    });\n    if (this.state.planFilter === 'active') plans = plans.filter(p => p.status === 'Active');\n    if (this.state.planFilter === 'draft')  plans = plans.filter(p => p.status === 'Draft');\n\n    const subsData = [\n      { wallet:'sent1q9k…4f2', plan:'Global Unlimited', access:'Paid',    status:'Active',   started:'Jun 18', renews:'in 27d', paid:'12 P2P' },\n      { wallet:'sent1pk2…9aa', plan:'Streamer',         access:'Paid',    status:'Active
